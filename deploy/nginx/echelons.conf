# /etc/nginx/sites-available/echelons.conf
upstream echelons_web     { server 127.0.0.1:3000; keepalive 16; }
upstream echelons_backend { server 127.0.0.1:4000; keepalive 32; }

server {
  listen 80;
  listen [::]:80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name recording.example.com;

  ssl_certificate     /etc/letsencrypt/live/recording.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/recording.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  client_max_body_size 50m;   # backup restore uploads
  server_tokens off;

  # Recordings are NEVER served statically (docs/07 §4) — safety net.
  location ~* ^/(recordings|var|spool)/ { return 404; }
  location ~* \.(wav|gsm|mp3|wav49)$ { return 404; }

  location /api/ws {
    proxy_pass http://echelons_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://echelons_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 120s;
    # audio streaming: pass Range through and do not buffer
    proxy_buffering off;
    proxy_request_buffering off;
  }

  location / {
    proxy_pass http://echelons_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

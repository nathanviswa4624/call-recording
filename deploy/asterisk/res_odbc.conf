; Echelons — ODBC connection used for realtime (read-only role) and CDR/CEL (insert).
; The password lives in /etc/odbc.ini (0640 root:asterisk), not here.
[asterisk]
enabled => yes
dsn => echelons-asterisk
pre-connect => yes
max_connections => 20
sanitysql => select 1
connect_timeout => 5
negative_connection_cache => 30
